name: Release

on:
  push:
    tags:
      - 'v*'
      - 'fs-*'
  # A tag pushed to the fork has not started this by itself. Run it by hand
  # on the tag: gh workflow run release.yml --ref <tag> -f staging_only=false
  workflow_dispatch:
    inputs:
      staging_only:
        description: 'Build and package into a throwaway draft only; never publish or create a tag'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  staging:
    name: Create temporary draft
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
      - name: Check CI storage policy
        run: bash ci/scripts/check_no_actions_artifacts.sh
      - name: Validate publication ref
        env:
          STAGING_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.staging_only }}
        run: |
          if [ "$STAGING_ONLY" != "true" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*|refs/tags/fs-*) ;;
              *) echo "::error::Publication requires an existing v* or fs-* tag"; exit 1 ;;
            esac
          fi
      - name: Create run-owned draft
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release_staging.sh create

  build-linux-android:
    name: Build (Linux / Android)
    needs: staging
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r23c
          add-to-path: true
          link-to-sdk: true

      - name: Set ANDROID_NDK_ROOT
        run: echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python3 -m pip install scons
          scons --version

      - name: Cache Steam Audio SDK
        uses: actions/cache@v5
        with:
          path: src/lib/steamaudio
          key: steamaudio-${{ hashFiles('scripts/install_steam_audio.py') }}

      - name: Install Steam Audio SDK
        run: bash .github/scripts/install_steam_audio_ci.sh

      - name: Add GCC problem matcher
        run: echo "::add-matcher::${{ github.workspace }}/.github/gcc-problem-matcher.json"

      - name: Cache SCons build
        uses: actions/cache@v5
        with:
          path: .scons-cache
          key: scons-Linux-all-v1-${{ hashFiles('src/lib/godot-cpp/SConstruct', 'SConstruct') }}
          restore-keys: |
            scons-Linux-all-

      - name: Create bin directories
        run: |
          BIN=addons/nexus_resonance/bin
          mkdir -p "$BIN"/{linux,android/arm64-v8a,android/x86_64}

      - name: Copy Steam Audio runtime libraries
        run: |
          BIN=addons/nexus_resonance/bin
          cp src/lib/steamaudio/lib/linux-x64/libphonon.so "$BIN/linux/"
          cp src/lib/steamaudio/lib/android-armv8/libphonon.so "$BIN/android/arm64-v8a/"
          cp src/lib/steamaudio/lib/android-x64/libphonon.so "$BIN/android/x86_64/"

      - name: Build Linux
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: |
          scons platform=linux target=template_debug build_tests=0 -j$(nproc)
          scons platform=linux target=template_release build_tests=0 -j$(nproc)

      - name: Build Android (arm64)
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: |
          scons platform=android arch=arm64 target=template_debug build_tests=0 ndk_version=23.2.8568313 -j$(nproc)
          scons platform=android arch=arm64 target=template_release build_tests=0 ndk_version=23.2.8568313 -j$(nproc)

      - name: Build Android (x86_64)
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: |
          scons platform=android arch=x86_64 target=template_debug build_tests=0 ndk_version=23.2.8568313 -j$(nproc)
          scons platform=android arch=x86_64 target=template_release build_tests=0 ndk_version=23.2.8568313 -j$(nproc)

      - name: Stage binaries on temporary draft
        uses: ./.github/actions/stage-binaries
        with:
          release_id: ${{ needs.staging.outputs.release_id }}
          bundle: bin-linux-android
        env:
          GH_TOKEN: ${{ github.token }}

  build-windows:
    name: Build (Windows MSVC)
    needs: staging
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          python -m pip install scons
          scons --version

      - name: Cache Steam Audio SDK
        uses: actions/cache@v5
        with:
          path: src/lib/steamaudio
          key: steamaudio-${{ hashFiles('scripts/install_steam_audio.py') }}

      - name: Install Steam Audio SDK
        env:
          PYTHON: python
        run: bash .github/scripts/install_steam_audio_ci.sh

      - name: Cache SCons build
        uses: actions/cache@v5
        with:
          path: .scons-cache
          key: scons-Windows-all-v1-${{ hashFiles('src/lib/godot-cpp/SConstruct', 'SConstruct') }}
          restore-keys: |
            scons-Windows-all-

      - name: Create bin directories
        run: |
          BIN=addons/nexus_resonance/bin
          mkdir -p "$BIN"/windows

      - name: Copy Steam Audio runtime libraries
        run: |
          BIN=addons/nexus_resonance/bin
          cp src/lib/steamaudio/lib/windows-x64/phonon.dll "$BIN/windows/"
          for dll in GPUUtilities.dll TrueAudioNext.dll; do
            [ -f "src/lib/steamaudio/lib/windows-x64/$dll" ] && cp "src/lib/steamaudio/lib/windows-x64/$dll" "$BIN/windows/"
          done

      - name: Build Windows
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: |
          scons platform=windows target=template_debug build_tests=0 -j${NUMBER_OF_PROCESSORS:-4}
          scons platform=windows target=template_release build_tests=0 -j${NUMBER_OF_PROCESSORS:-4}

      - name: Remove MSVC build artifacts
        run: |
          BIN=addons/nexus_resonance/bin/windows
          rm -f "$BIN"/*.exp "$BIN"/*.lib

      - name: Stage binaries on temporary draft
        uses: ./.github/actions/stage-binaries
        with:
          release_id: ${{ needs.staging.outputs.release_id }}
          bundle: bin-windows
        env:
          GH_TOKEN: ${{ github.token }}

  build-macos-ios:
    name: Build (macOS / iOS)
    needs: staging
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install scons
          scons --version

      - name: Cache Steam Audio SDK
        uses: actions/cache@v5
        with:
          path: src/lib/steamaudio
          key: steamaudio-${{ hashFiles('scripts/install_steam_audio.py') }}

      - name: Install Steam Audio SDK
        run: bash .github/scripts/install_steam_audio_ci.sh

      - name: Cache SCons build
        uses: actions/cache@v5
        with:
          path: .scons-cache
          key: scons-macOS-all-v1-${{ hashFiles('src/lib/godot-cpp/SConstruct', 'SConstruct') }}
          restore-keys: |
            scons-macOS-all-

      - name: Create bin directories
        run: |
          BIN=addons/nexus_resonance/bin
          mkdir -p "$BIN"/{macos,ios}

      - name: Copy Steam Audio runtime libraries
        run: |
          BIN=addons/nexus_resonance/bin
          cp src/lib/steamaudio/lib/osx/libphonon.dylib "$BIN/macos/"
          cp src/lib/steamaudio/lib/ios/libphonon.a "$BIN/ios/"

      - name: Build iOS dependencies
        run: make ios-deps

      - name: Build macOS
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: |
          scons platform=macos target=template_debug build_tests=0 -j$(sysctl -n hw.logicalcpu)
          scons platform=macos target=template_release build_tests=0 -j$(sysctl -n hw.logicalcpu)

      - name: Build iOS
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: |
          scons platform=ios arch=arm64 target=template_debug build_tests=0 -j$(sysctl -n hw.logicalcpu)
          scons platform=ios arch=arm64 target=template_release build_tests=0 -j$(sysctl -n hw.logicalcpu)

      - name: Copy iOS static libraries
        run: |
          BIN=addons/nexus_resonance/bin/ios
          cp src/lib/godot-cpp/bin/libgodot-cpp.ios.template_debug.arm64.a "$BIN/"
          cp src/lib/godot-cpp/bin/libgodot-cpp.ios.template_release.arm64.a "$BIN/"

      - name: Stage binaries on temporary draft
        uses: ./.github/actions/stage-binaries
        with:
          release_id: ${{ needs.staging.outputs.release_id }}
          bundle: bin-macos-ios
        env:
          GH_TOKEN: ${{ github.token }}

  build-linux-arm64:
    name: Build (Linux arm64)
    needs: staging
    runs-on: ubuntu-22.04
    env:
      SYSROOT: ${{ github.workspace }}/sysroot-bullseye-arm64
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      # Valve ships no Linux arm64 library, so Steam Audio is built from the fork.
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/steam-audio
          ref: fingerslingers
          path: steam-audio

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu g++-aarch64-linux-gnu unzip file
          python3 -m pip install scons
          scons --version

      - name: Cache Steam Audio SDK
        uses: actions/cache@v5
        with:
          path: src/lib/steamaudio
          key: steamaudio-${{ hashFiles('scripts/install_steam_audio.py') }}

      - name: Install Steam Audio SDK (headers)
        run: bash .github/scripts/install_steam_audio_ci.sh

      # Debian 11 sysroot: glibc 2.31, the same as the Steam Linux Runtime 3.0.
      - name: Create sysroot
        run: python3 scripts/make_linux_arm64_sysroot.py "$SYSROOT"

      - name: Build Steam Audio
        env:
          STEAMAUDIO_LINUX_ARM64_CC: clang
          STEAMAUDIO_LINUX_ARM64_CXX: clang++
          STEAMAUDIO_LINUX_ARM64_SYSROOT: ${{ env.SYSROOT }}
        run: |
          cd steam-audio/core/build
          python3 get_dependencies.py --toolsonly
          python3 get_dependencies.py -p linux -a arm64 --libsonly
          cd ..
          cmake -G "Unix Makefiles" -S . -B build/linux-arm64-release \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/build/toolchain_linux_arm64.cmake \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DSTEAMAUDIO_BUILD_TESTS=OFF -DSTEAMAUDIO_BUILD_BENCHMARKS=OFF -DSTEAMAUDIO_BUILD_SAMPLES=OFF \
            -DSTEAMAUDIO_BUILD_ITESTS=OFF -DSTEAMAUDIO_BUILD_DOCS=OFF \
            -DSTEAMAUDIO_ENABLE_IPP=OFF -DSTEAMAUDIO_ENABLE_MKL=OFF -DSTEAMAUDIO_ENABLE_EMBREE=OFF \
            -DSTEAMAUDIO_ENABLE_RADEONRAYS=OFF -DSTEAMAUDIO_ENABLE_TRUEAUDIONEXT=OFF -DSTEAMAUDIO_ENABLE_AVX=OFF \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld -static-libstdc++ -static-libgcc"
          cmake --build build/linux-arm64-release --target phonon -j$(nproc)

      - name: Build extension
        env:
          LINUX_ARM64_SYSROOT: ${{ env.SYSROOT }}
        run: |
          BIN=addons/nexus_resonance/bin/linux-arm64
          mkdir -p src/lib/steamaudio/lib/linux-arm64 "$BIN"
          aarch64-linux-gnu-strip --strip-unneeded -o src/lib/steamaudio/lib/linux-arm64/libphonon.so \
            steam-audio/core/build/linux-arm64-release/src/core/libphonon.so
          cp src/lib/steamaudio/lib/linux-arm64/libphonon.so "$BIN/"
          scons platform=linux arch=arm64 use_llvm=yes use_static_cpp=yes target=template_release build_tests=0 debug_symbols=no -j$(nproc)
          aarch64-linux-gnu-strip --strip-unneeded "$BIN/libnexus_resonance.so"

      - name: Verify
        run: |
          BIN=addons/nexus_resonance/bin/linux-arm64
          file "$BIN"/*.so
          file "$BIN/libnexus_resonance.so" | grep -q "ARM aarch64"
          file "$BIN/libphonon.so" | grep -q "ARM aarch64"
          MAX=$(aarch64-linux-gnu-objdump -T "$BIN"/*.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol version required: $MAX"
          python3 -c "import sys; v=tuple(int(x) for x in '$MAX'.split('_')[1].split('.')); sys.exit(0 if v <= (2,31) else 1)"

      - name: Stage binaries on temporary draft
        uses: ./.github/actions/stage-binaries
        with:
          release_id: ${{ needs.staging.outputs.release_id }}
          bundle: bin-linux-arm64
        env:
          GH_TOKEN: ${{ github.token }}

  build-visionos:
    name: Build (visionOS)
    needs: staging
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      # Valve ships no visionOS library, so Steam Audio is built from the fork.
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/steam-audio
          ref: fingerslingers
          path: steam-audio

      - name: Install dependencies
        run: |
          PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install scons cmake
          scons --version
          cmake --version
          xcodebuild -version
          xcrun --sdk xros --show-sdk-path

      - name: Cache Steam Audio SDK
        uses: actions/cache@v5
        with:
          path: src/lib/steamaudio
          key: steamaudio-${{ hashFiles('scripts/install_steam_audio.py') }}

      - name: Install Steam Audio SDK (headers)
        run: bash .github/scripts/install_steam_audio_ci.sh

      - name: Build (device)
        run: make build-visionos STEAM_AUDIO_SRC=steam-audio

      - name: Build (simulator)
        run: make build-visionos-simulator STEAM_AUDIO_SRC=steam-audio

      - name: Verify
        run: |
          BIN=addons/nexus_resonance/bin
          for f in "$BIN"/visionos/*.a; do
            lipo -info "$f" | grep -q arm64
            otool -l "$f" | grep -m1 "platform 11"
          done
          for f in "$BIN"/visionos_simulator/*.a; do
            lipo -info "$f" | grep -q arm64
            otool -l "$f" | grep -m1 "platform 12"
          done
          nm -g "$BIN"/visionos/libnexus_resonance.visionos.template_release.arm64.a | grep -q nexus_resonance_library_init

      # Godot has no feature tag for the simulator, so one entry has to serve
      # both: an xcframework holding the device and the simulator library.
      - name: Pack xcframeworks
        run: |
          make visionos-xcframeworks
          ls addons/nexus_resonance/bin/visionos-xcframeworks
          rm -rf addons/nexus_resonance/bin/visionos addons/nexus_resonance/bin/visionos_simulator

      - name: Stage binaries on temporary draft
        uses: ./.github/actions/stage-binaries
        with:
          release_id: ${{ needs.staging.outputs.release_id }}
          bundle: bin-visionos
        env:
          GH_TOKEN: ${{ github.token }}

  create-release:
    name: Package Release
    needs: [staging, build-linux-android, build-linux-arm64, build-windows, build-macos-ios, build-visionos]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      STAGING_RELEASE_ID: ${{ needs.staging.outputs.release_id }}
      STAGING_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.staging_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Download staged build bundles
        run: |
          for bundle in bin-linux-android bin-windows bin-macos-ios bin-linux-arm64 bin-visionos; do
            mkdir -p "staged/$bundle"
            bash .github/scripts/release_staging.sh download "$bundle.tar.gz" "$RUNNER_TEMP"
            tar -xzf "$RUNNER_TEMP/$bundle.tar.gz" -C "staged/$bundle"
          done

      - name: Prepare release addon
        run: |
          mkdir -p release_addon/addons/nexus_resonance/bin
          cp -r addons/nexus_resonance/* release_addon/addons/nexus_resonance/
          cp -r staged/bin-linux-android/* release_addon/addons/nexus_resonance/bin/
          cp -r staged/bin-windows/* release_addon/addons/nexus_resonance/bin/
          cp -r staged/bin-macos-ios/* release_addon/addons/nexus_resonance/bin/
          cp -r staged/bin-linux-arm64/* release_addon/addons/nexus_resonance/bin/
          cp -r staged/bin-visionos/* release_addon/addons/nexus_resonance/bin/
          cp LICENSE release_addon/addons/nexus_resonance/

      - name: Verify build outputs
        run: |
          echo "=== Release addon contents ==="
          find release_addon -type f | sort
          echo ""
          for f in \
            release_addon/addons/nexus_resonance/bin/windows/nexus_resonance.dll \
            release_addon/addons/nexus_resonance/bin/linux/libnexus_resonance.so \
            release_addon/addons/nexus_resonance/bin/macos/libnexus_resonance.dylib \
            release_addon/addons/nexus_resonance/bin/linux-arm64/libnexus_resonance.so \
            release_addon/addons/nexus_resonance/bin/android/arm64-v8a/libnexus_resonance.so \
            release_addon/addons/nexus_resonance/bin/visionos-xcframeworks/libphonon.xcframework/Info.plist \
          ; do
            if [ -f "$f" ]; then
              echo "OK: $f"
            else
              echo "::error::$f not found"
              exit 1
            fi
          done

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$STAGING_ONLY" = "true" ]; then
            TAG="ci-stage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Create addon zip
        run: |
          mkdir -p release_packages
          cd release_addon
          zip -r ../release_packages/nexus_resonance-${{ steps.version.outputs.version }}.zip addons
          cd ../release_packages && sha256sum *.zip | tee SHA256SUMS.txt

      - name: Prepare release body
        if: env.STAGING_ONLY != 'true'
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          CHANGELOG_SECTION=""
          if [ -f ".github/scripts/extract_changelog.py" ]; then
            CHANGELOG_SECTION=$(VERSION="$VERSION" CHANGELOG_PATH="docs/CHANGELOG.md" python3 .github/scripts/extract_changelog.py 2>/dev/null || true)
          fi
          {
            if [ -n "$CHANGELOG_SECTION" ]; then
              echo "$CHANGELOG_SECTION"
              echo ""
            fi
            echo "## Platforms"
            echo ""
            echo "This release includes binaries for all supported platforms:"
            echo "- Windows x86_64 (MSVC)"
            echo "- Linux x86_64"
            echo "- macOS (universal)"
            echo "- Android (arm64, x86_64)"
            echo "- iOS (arm64)"
            echo "- Linux arm64 (glibc 2.31+, for Steam Frame)"
            echo "- visionOS (arm64)"
            echo ""
            echo "## Installation"
            echo ""
            echo "Download **nexus_resonance-${VERSION}.zip** and extract the \`addons/\` folder into your Godot project root."
            echo ""
            echo "See [README](https://github.com/${{ github.repository }}) for requirements and usage."
          } > release_body.md

      - name: Stage validation package (no publication)
        if: env.STAGING_ONLY == 'true'
        run: |
          bash .github/scripts/release_staging.sh upload release_packages/*.zip release_packages/SHA256SUMS.txt
          bash .github/scripts/release_staging.sh inspect | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create Release without replacing existing assets
        if: env.STAGING_ONLY != 'true'
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -se --arg tag "$tag" 'all(.[][]; .tag_name != $tag)'
          flags=()
          if [[ "$tag" == *-rc* ]]; then flags+=(--prerelease); fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$tag" --notes-file release_body.md "${flags[@]}" \
            release_packages/*.zip release_packages/SHA256SUMS.txt

      - name: Delete only this run's staging draft after publication
        if: env.STAGING_ONLY != 'true'
        run: bash .github/scripts/release_staging.sh delete
