name: Release

on:
  push:
    tags:
      - 'v*'
      - 'fs-*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  staging:
    name: Create run-owned staging draft
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
      - name: Reject Actions artifact storage
        run: bash ci/scripts/check_no_actions_artifacts.sh
      - name: Create draft without creating a tag
        id: create
        run: bash .github/scripts/release_staging.sh create

  build-linux-android:
    name: Build (Linux / Android)
    needs: staging
    runs-on: ubuntu-22.04
    env:
      STAGING_RELEASE_ID: ${{ needs.staging.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r23c
          add-to-path: true
          link-to-sdk: true

      - name: Set ANDROID_NDK_ROOT
        run: echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python3 -m pip install scons
          scons --version

      - name: Cache Steam Audio SDK
        uses: actions/cache@v5
        with:
          path: src/lib/steamaudio
          key: steamaudio-${{ hashFiles('scripts/install_steam_audio.py') }}

      - name: Install Steam Audio SDK
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          bash .github/scripts/install_steam_audio_ci.sh

      - name: Add GCC problem matcher
        run: echo "::add-matcher::${{ github.workspace }}/.github/gcc-problem-matcher.json"

      - name: Preserve Steam Audio notices
        run: bash .github/scripts/release_staging.sh upload src/lib/steamaudio/THIRDPARTY.md

      - name: Cache SCons build
        uses: actions/cache@v5
        with:
          path: .scons-cache
          key: scons-Linux-all-v1-${{ hashFiles('src/lib/godot-cpp/SConstruct', 'SConstruct') }}
          restore-keys: |
            scons-Linux-all-

      - name: Create bin directories
        run: |
          BIN=addons/nexus_resonance/bin
          mkdir -p "$BIN"/{linux,android/arm64-v8a,android/x86_64}

      - name: Copy Steam Audio runtime libraries
        run: |
          BIN=addons/nexus_resonance/bin
          cp src/lib/steamaudio/lib/linux-x64/libphonon.so "$BIN/linux/"
          cp src/lib/steamaudio/lib/android-armv8/libphonon.so "$BIN/android/arm64-v8a/"
          cp src/lib/steamaudio/lib/android-x64/libphonon.so "$BIN/android/x86_64/"

      - name: Build Linux
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: |
          scons platform=linux target=template_debug build_tests=0 -j$(nproc)
          scons platform=linux target=template_release build_tests=0 -j$(nproc)

      - name: Build Android (arm64)
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: |
          scons platform=android arch=arm64 target=template_debug build_tests=0 ndk_version=23.2.8568313 -j$(nproc)
          scons platform=android arch=arm64 target=template_release build_tests=0 ndk_version=23.2.8568313 -j$(nproc)

      - name: Build Android (x86_64)
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: |
          scons platform=android arch=x86_64 target=template_debug build_tests=0 ndk_version=23.2.8568313 -j$(nproc)
          scons platform=android arch=x86_64 target=template_release build_tests=0 ndk_version=23.2.8568313 -j$(nproc)

      - name: Stage Linux and Android bundle
        run: |
          tar -czf "$RUNNER_TEMP/bin-linux-android.tar.gz" -C addons/nexus_resonance/bin .
          bash .github/scripts/release_staging.sh upload "$RUNNER_TEMP/bin-linux-android.tar.gz"

  build-windows:
    name: Build (Windows MSVC)
    needs: staging
    runs-on: windows-2022
    env:
      STAGING_RELEASE_ID: ${{ needs.staging.outputs.release_id }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          python -m pip install scons
          scons --version

      - name: Cache Steam Audio SDK
        uses: actions/cache@v5
        with:
          path: src/lib/steamaudio
          key: steamaudio-${{ hashFiles('scripts/install_steam_audio.py') }}

      - name: Install Steam Audio SDK
        env:
          PYTHON: python
        run: bash .github/scripts/install_steam_audio_ci.sh

      - name: Cache SCons build
        uses: actions/cache@v5
        with:
          path: .scons-cache
          key: scons-Windows-all-v1-${{ hashFiles('src/lib/godot-cpp/SConstruct', 'SConstruct') }}
          restore-keys: |
            scons-Windows-all-

      - name: Create bin directories
        run: |
          BIN=addons/nexus_resonance/bin
          mkdir -p "$BIN"/windows

      - name: Copy Steam Audio runtime libraries
        run: |
          BIN=addons/nexus_resonance/bin
          cp src/lib/steamaudio/lib/windows-x64/phonon.dll "$BIN/windows/"
          for dll in GPUUtilities.dll TrueAudioNext.dll; do
            [ -f "src/lib/steamaudio/lib/windows-x64/$dll" ] && cp "src/lib/steamaudio/lib/windows-x64/$dll" "$BIN/windows/"
          done

      - name: Build Windows
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: |
          scons platform=windows target=template_debug build_tests=0 -j${NUMBER_OF_PROCESSORS:-4}
          scons platform=windows target=template_release build_tests=0 -j${NUMBER_OF_PROCESSORS:-4}

      - name: Remove MSVC build artifacts
        run: |
          BIN=addons/nexus_resonance/bin/windows
          rm -f "$BIN"/*.exp "$BIN"/*.lib

      - name: Stage Windows bundle
        run: |
          tar -czf "$RUNNER_TEMP/bin-windows.tar.gz" -C addons/nexus_resonance/bin .
          bash .github/scripts/release_staging.sh upload "$RUNNER_TEMP/bin-windows.tar.gz"

  build-macos-ios:
    name: Build (macOS / iOS)
    needs: staging
    runs-on: macos-latest
    env:
      STAGING_RELEASE_ID: ${{ needs.staging.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install scons
          scons --version

      - name: Cache Steam Audio SDK
        uses: actions/cache@v5
        with:
          path: src/lib/steamaudio
          key: steamaudio-${{ hashFiles('scripts/install_steam_audio.py') }}

      - name: Install Steam Audio SDK
        run: bash .github/scripts/install_steam_audio_ci.sh

      - name: Cache SCons build
        uses: actions/cache@v5
        with:
          path: .scons-cache
          key: scons-macOS-all-v1-${{ hashFiles('src/lib/godot-cpp/SConstruct', 'SConstruct') }}
          restore-keys: |
            scons-macOS-all-

      - name: Create bin directories
        run: |
          BIN=addons/nexus_resonance/bin
          mkdir -p "$BIN"/{macos,ios}

      - name: Copy Steam Audio runtime libraries
        run: |
          BIN=addons/nexus_resonance/bin
          cp src/lib/steamaudio/lib/osx/libphonon.dylib "$BIN/macos/"
          cp src/lib/steamaudio/lib/ios/libphonon.a "$BIN/ios/"

      - name: Build iOS dependencies
        run: make ios-deps

      - name: Build macOS
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: |
          scons platform=macos arch=universal target=template_debug build_tests=0 -j$(sysctl -n hw.logicalcpu)
          lipo addons/nexus_resonance/bin/macos/libnexus_resonance.dylib -verify_arch arm64 x86_64
          scons platform=macos arch=universal target=template_release build_tests=0 -j$(sysctl -n hw.logicalcpu)
          lipo addons/nexus_resonance/bin/macos/libnexus_resonance.dylib -verify_arch arm64 x86_64
          lipo addons/nexus_resonance/bin/macos/libphonon.dylib -verify_arch arm64 x86_64

      - name: Setup Godot for addon load and lifetime regression
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify macOS addon in Godot
        run: bash .github/scripts/test_macos_addon.sh

      - name: Show macOS diagnostics in job log
        if: always()
        run: bash .github/scripts/show_ci_diagnostics.sh

      - name: Save successful macOS compilation cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .scons-cache
          key: scons-macOS-all-v1-${{ hashFiles('src/lib/godot-cpp/SConstruct', 'SConstruct') }}

      - name: Build iOS
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: |
          scons platform=ios arch=arm64 target=template_debug build_tests=0 -j$(sysctl -n hw.logicalcpu)
          scons platform=ios arch=arm64 target=template_release build_tests=0 -j$(sysctl -n hw.logicalcpu)

      - name: Copy iOS static libraries
        run: |
          BIN=addons/nexus_resonance/bin/ios
          cp src/lib/godot-cpp/bin/libgodot-cpp.ios.template_debug.arm64.a "$BIN/"
          cp src/lib/godot-cpp/bin/libgodot-cpp.ios.template_release.arm64.a "$BIN/"

      - name: Stage macOS and iOS bundle
        run: |
          tar -czf "$RUNNER_TEMP/bin-macos-ios.tar.gz" -C addons/nexus_resonance/bin .
          bash .github/scripts/release_staging.sh upload "$RUNNER_TEMP/bin-macos-ios.tar.gz"

  build-linux-arm64:
    name: Build (Linux arm64)
    needs: staging
    runs-on: ubuntu-22.04
    env:
      SYSROOT: ${{ github.workspace }}/sysroot-bullseye-arm64
      STAGING_RELEASE_ID: ${{ needs.staging.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          python3 -m pip install scons
      - name: Cache Steam Audio SDK
        uses: actions/cache@v5
        with:
          path: src/lib/steamaudio
          key: steamaudio-${{ hashFiles('scripts/install_steam_audio.py') }}
      - name: Install pinned Steam Audio SDK
        run: bash .github/scripts/install_steam_audio_ci.sh
      - name: Create sysroot
        run: python3 scripts/make_linux_arm64_sysroot.py "$SYSROOT"
      - name: Build extension
        env:
          LINUX_ARM64_SYSROOT: ${{ env.SYSROOT }}
        run: |
          BIN=addons/nexus_resonance/bin/linux-arm64
          mkdir -p "$BIN"
          cp src/lib/steamaudio/lib/linux-arm64/libphonon.so "$BIN/"
          scons platform=linux arch=arm64 use_llvm=yes use_static_cpp=yes target=template_debug build_tests=0 -j$(nproc)
          scons platform=linux arch=arm64 use_llvm=yes use_static_cpp=yes target=template_release build_tests=0 -j$(nproc)
          aarch64-linux-gnu-strip --strip-unneeded "$BIN/libnexus_resonance.so"
      - name: Verify Linux arm64
        run: |
          BIN=addons/nexus_resonance/bin/linux-arm64
          for f in "$BIN"/*.so; do
            file "$f" | grep "ARM aarch64"
          done
          MAX=$(aarch64-linux-gnu-objdump -T "$BIN"/*.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "Highest glibc requirement: $MAX"
          python3 -c "assert tuple(map(int, '$MAX'.split('_')[1].split('.'))) <= (2,31)"
      - name: Stage Linux arm64 bundle
        run: |
          tar -czf "$RUNNER_TEMP/bin-linux-arm64.tar.gz" -C addons/nexus_resonance/bin .
          bash .github/scripts/release_staging.sh upload "$RUNNER_TEMP/bin-linux-arm64.tar.gz"

  build-visionos:
    name: Build (visionOS)
    needs: staging
    runs-on: macos-15
    env:
      STAGING_RELEASE_ID: ${{ needs.staging.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install scons
          xcrun --sdk xros --show-sdk-path
          xcrun --sdk xrsimulator --show-sdk-path
      - name: Cache Steam Audio SDK
        uses: actions/cache@v5
        with:
          path: src/lib/steamaudio
          key: steamaudio-${{ hashFiles('scripts/install_steam_audio.py') }}
      - name: Install pinned Steam Audio SDK
        run: bash .github/scripts/install_steam_audio_ci.sh
      - name: Build addon for device and simulator
        run: make build-visionos build-visionos-simulator SCONS_FLAGS="-j$(sysctl -n hw.logicalcpu)"
      - name: Verify addon architectures and final links
        run: bash scripts/verify_visionos.sh
      - name: Pack XCFrameworks
        run: make visionos-xcframeworks
      - name: Stage visionOS bundle
        run: |
          tar -czf "$RUNNER_TEMP/bin-visionos.tar.gz" -C addons/nexus_resonance/bin/visionos-xcframeworks .
          bash .github/scripts/release_staging.sh upload "$RUNNER_TEMP/bin-visionos.tar.gz"

  create-release:
    name: Create Release
    needs: [staging, build-linux-android, build-linux-arm64, build-windows, build-macos-ios, build-visionos]
    runs-on: ubuntu-22.04
    env:
      STAGING_RELEASE_ID: ${{ needs.staging.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Download owned staging bundles
        run: |
          for bundle in bin-linux-android bin-linux-arm64 bin-windows bin-macos-ios bin-visionos; do
            mkdir -p "staging/$bundle"
            bash .github/scripts/release_staging.sh download "$bundle.tar.gz" "$RUNNER_TEMP"
            tar -xzf "$RUNNER_TEMP/$bundle.tar.gz" -C "staging/$bundle"
          done
          mkdir -p staging/steam-audio-notices
          bash .github/scripts/release_staging.sh download THIRDPARTY.md staging/steam-audio-notices

      - name: Prepare release addon
        run: |
          mkdir -p release_addon/addons/nexus_resonance/bin
          cp -r addons/nexus_resonance/* release_addon/addons/nexus_resonance/
          cp -r staging/bin-linux-android/* release_addon/addons/nexus_resonance/bin/
          cp -r staging/bin-windows/* release_addon/addons/nexus_resonance/bin/
          cp -r staging/bin-macos-ios/* release_addon/addons/nexus_resonance/bin/
          cp -r staging/bin-linux-arm64/* release_addon/addons/nexus_resonance/bin/
          mkdir -p release_addon/addons/nexus_resonance/bin/visionos-xcframeworks
          cp -r staging/bin-visionos/* release_addon/addons/nexus_resonance/bin/visionos-xcframeworks/
          cp LICENSE release_addon/addons/nexus_resonance/
          cp staging/steam-audio-notices/THIRDPARTY.md release_addon/addons/nexus_resonance/STEAM_AUDIO_THIRDPARTY.md
          printf '%s\n' "$GITHUB_SHA" > release_addon/addons/nexus_resonance/bin/VERSION
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import install_steam_audio as sdk
          Path("release_addon/addons/nexus_resonance/BUILD_PROVENANCE.json").write_text(json.dumps({
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "sdk_url": sdk.SDK_URL,
              "sdk_sha256": sdk.SDK_SHA256,
          }, indent=2) + "\n")
          PY

      - name: Verify build outputs
        run: |
          python3 scripts/verify_release.py release_addon

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create addon zip
        run: |
          mkdir -p release_packages
          cd release_addon
          zip -qr ../release_packages/nexus_resonance-${{ steps.version.outputs.version }}.zip addons
          cd ../release_packages
          sha256sum *.zip > SHA256SUMS.txt

      - name: Upload verified package without publishing
        run: bash .github/scripts/release_staging.sh upload release_packages/*.zip release_packages/SHA256SUMS.txt

      - name: Prepare release body
        if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          CHANGELOG_SECTION=""
          if [ -f ".github/scripts/extract_changelog.py" ]; then
            CHANGELOG_SECTION=$(VERSION="$VERSION" CHANGELOG_PATH="docs/CHANGELOG.md" python3 .github/scripts/extract_changelog.py 2>/dev/null || true)
          fi
          {
            if [ -n "$CHANGELOG_SECTION" ]; then
              echo "$CHANGELOG_SECTION"
              echo ""
            fi
            echo "## Platforms"
            echo ""
            echo "This release includes binaries for all supported platforms:"
            echo "- Windows x86_64 (MSVC)"
            echo "- Linux x86_64"
            echo "- Linux arm64 (glibc 2.31 or newer)"
            echo "- macOS (universal)"
            echo "- Android (arm64, x86_64)"
            echo "- iOS (arm64)"
            echo "- visionOS 2.0+ (arm64 device and simulator XCFrameworks; link -lz -lc++)"
            echo ""
            echo "## Installation"
            echo ""
            echo "Download **nexus_resonance-${GITHUB_REF_NAME}.zip** and extract the \`addons/\` folder into your Godot project root."
            echo ""
            echo "See [README](https://github.com/${{ github.repository }}) for requirements and usage."
          } > release_body.md

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: release_body.md
          files: |
            release_packages/*.zip
            release_packages/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup-staging:
    name: Delete staging draft after tag release
    needs: [staging, build-linux-android, build-linux-arm64, build-windows, build-macos-ios, build-visionos, create-release]
    if: always() && github.event_name == 'push' && needs.staging.result == 'success'
    runs-on: ubuntu-22.04
    env:
      STAGING_RELEASE_ID: ${{ needs.staging.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
      - run: bash .github/scripts/release_staging.sh delete
