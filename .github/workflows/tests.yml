# PR gate: Linux C++ (+ Catch2), optional Godot GUT/smokes.
# Not on push/merge to main (already covered by the PR run).
# Multi-platform binaries: release.yml (tags) or Build GDExtension (manual).
# Windows C++ and full smoke suite: workflow_dispatch only.
name: Tests

on:
  pull_request:
    branches: [main, master, fingerslingers]
    paths:
      - 'src/**'
      - 'SConstruct'
      - 'scripts/install_steam_audio.py'
      - 'scripts/check_clang_format.sh'
      - 'scripts/format_cpp.sh'
      - 'scripts/strip_compile_commands_for_clang_tidy.py'
      - 'addons/nexus_resonance/**/*.gd'
      - 'addons/nexus_resonance/**/*.gdextension'
      - 'addons/nexus_resonance/doc_classes/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - 'ci/**'
  workflow_dispatch:
    inputs:
      run_windows:
        description: 'Also run Windows C++ build & unit tests'
        type: boolean
        default: false
      run_all_smokes:
        description: 'Run full Godot smoke suite (default: lightning only)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Check changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cpp: ${{ steps.result.outputs.cpp }}
      gd: ${{ steps.result.outputs.gd }}
      run_godot: ${{ steps.result.outputs.run_godot }}
      run_windows: ${{ steps.result.outputs.run_windows }}
      run_all_smokes: ${{ steps.result.outputs.run_all_smokes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check CI storage policy
        run: bash ci/scripts/check_no_actions_artifacts.sh

      - name: Test draft staging safeguards
        run: python3 -m unittest discover -s ci/tests -v

      # Prefer git history over the Pulls API (works with read-only tokens).
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ github.event.pull_request.base.sha }}
          ref: ${{ github.event.pull_request.head.sha }}
          filters: |
            cpp:
              - 'src/**'
              - 'SConstruct'
              - 'scripts/install_steam_audio.py'
              - 'scripts/check_clang_format.sh'
              - 'scripts/format_cpp.sh'
              - 'scripts/strip_compile_commands_for_clang_tidy.py'
              - '.github/scripts/install_steam_audio_ci.sh'
              - 'addons/nexus_resonance/**/*.gdextension'
              - 'addons/nexus_resonance/doc_classes/**'
            gd:
              - 'addons/nexus_resonance/**/*.gd'
            workflow:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/scripts/**'
              - 'ci/**'

      - id: result
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "cpp=true" >> "$GITHUB_OUTPUT"
            echo "gd=true" >> "$GITHUB_OUTPUT"
            echo "run_godot=true" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.run_windows }}" = "true" ]; then
              echo "run_windows=true" >> "$GITHUB_OUTPUT"
            else
              echo "run_windows=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "${{ inputs.run_all_smokes }}" = "true" ]; then
              echo "run_all_smokes=true" >> "$GITHUB_OUTPUT"
            else
              echo "run_all_smokes=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          CPP="${{ steps.filter.outputs.cpp }}"
          GD="${{ steps.filter.outputs.gd }}"
          WF="${{ steps.filter.outputs.workflow }}"
          echo "cpp=$CPP" >> "$GITHUB_OUTPUT"
          echo "gd=$GD" >> "$GITHUB_OUTPUT"

          # CI changes exercise both native and Godot coverage.
          if [ "$WF" = "true" ]; then
            echo "cpp=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$CPP" = "true" ] || [ "$GD" = "true" ] || [ "$WF" = "true" ]; then
            echo "run_godot=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_godot=false" >> "$GITHUB_OUTPUT"
          fi

          # Windows MSVC is costly; only via workflow_dispatch (run_windows input).
          echo "run_windows=false" >> "$GITHUB_OUTPUT"

          # Full smoke suite only via workflow_dispatch; PRs run lightning only.
          echo "run_all_smokes=false" >> "$GITHUB_OUTPUT"

  cpp-linux:
    name: C++ + Godot (Linux)
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check CI storage policy
        run: bash ci/scripts/check_no_actions_artifacts.sh

      - name: Cache Steam Audio SDK
        uses: actions/cache@v5
        with:
          path: src/lib/steamaudio
          key: steamaudio-${{ hashFiles('scripts/install_steam_audio.py') }}

      - name: Install Steam Audio SDK
        run: bash .github/scripts/install_steam_audio_ci.sh

      - name: Add GCC problem matcher
        run: echo "::add-matcher::${{ github.workspace }}/.github/gcc-problem-matcher.json"

      - name: Cache SCons build
        uses: actions/cache@v5
        with:
          path: .scons-cache
          key: scons-tests-Linux-v4-${{ hashFiles('src/lib/godot-cpp/SConstruct', 'SConstruct', 'src/register_types.cpp', 'src/resonance_server*.cpp', 'src/resonance_server.h', 'src/handle_manager.cpp', 'src/test/test_main.cpp', 'src/test/test_ipl_guard.cpp') }}
          restore-keys: |
            scons-tests-Linux-

      - name: Install SCons
        run: pip install scons

      - name: Create bin directory
        run: mkdir -p addons/nexus_resonance/bin/linux

      - name: Copy Steam Audio runtime libraries
        run: cp src/lib/steamaudio/lib/linux-x64/libphonon.so addons/nexus_resonance/bin/linux/

      - name: Clang-format check
        run: |
          sudo apt-get install -y clang-format-14
          bash scripts/check_clang_format.sh

      - name: Build C++ extension and tests
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: scons platform=linux target=editor build_tests=1 compiledb=1 -j$(nproc)

      - name: Run C++ unit tests
        run: ./build/tests/nexus_resonance_tests

      - name: Clang-Tidy (strict subset)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y clang-tidy
          if [ ! -f compile_commands.json ]; then
            echo "compile_commands.json missing (expected from SCons compiledb=1 build)"
            exit 1
          fi
          python3 scripts/strip_compile_commands_for_clang_tidy.py compile_commands.json
          CHECKS='-*,bugprone-*,-bugprone-easily-swappable-parameters,cert-*,clang-analyzer-*'
          clang-tidy -p . src/handle_manager.cpp src/test/test_ipl_guard.cpp \
            -checks="$CHECKS" --warnings-as-errors=*

      - name: Cache Linux extension binary
        uses: actions/cache/save@v5
        with:
          path: addons/nexus_resonance/bin/linux
          key: linux-ext-bin-${{ hashFiles('src/**/*.cpp', 'src/**/*.h', 'SConstruct', 'scripts/install_steam_audio.py') }}

      - name: Run Godot tests in the build workspace
        if: needs.changes.outputs.run_godot == 'true'
        uses: ./.github/actions/godot-tests
        with:
          run_all_smokes: ${{ needs.changes.outputs.run_all_smokes }}

  # GDScript-only changes: reuse cached Linux .so instead of a full scons rebuild.
  ensure-bin-linux:
    name: Godot (GD-only, local Linux bin)
    needs: changes
    if: needs.changes.outputs.run_godot == 'true' && needs.changes.outputs.cpp != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check CI storage policy
        run: bash ci/scripts/check_no_actions_artifacts.sh

      - name: Restore Linux extension binary
        id: bin-cache
        uses: actions/cache@v5
        with:
          path: addons/nexus_resonance/bin/linux
          key: linux-ext-bin-${{ hashFiles('src/**/*.cpp', 'src/**/*.h', 'SConstruct', 'scripts/install_steam_audio.py') }}

      - name: Cache Steam Audio SDK
        if: steps.bin-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: src/lib/steamaudio
          key: steamaudio-${{ hashFiles('scripts/install_steam_audio.py') }}

      - name: Cache SCons build
        if: steps.bin-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: .scons-cache
          key: scons-tests-Linux-v4-${{ hashFiles('src/lib/godot-cpp/SConstruct', 'SConstruct', 'src/register_types.cpp', 'src/resonance_server*.cpp', 'src/resonance_server.h', 'src/handle_manager.cpp', 'src/test/test_main.cpp', 'src/test/test_ipl_guard.cpp') }}
          restore-keys: |
            scons-tests-Linux-

      - name: Build Linux extension (cache miss)
        if: steps.bin-cache.outputs.cache-hit != 'true'
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: |
          bash .github/scripts/install_steam_audio_ci.sh
          pip install scons
          mkdir -p addons/nexus_resonance/bin/linux
          cp src/lib/steamaudio/lib/linux-x64/libphonon.so addons/nexus_resonance/bin/linux/
          scons platform=linux target=template_debug build_tests=0 -j$(nproc)

      - name: Run Godot tests in the build workspace
        uses: ./.github/actions/godot-tests
        with:
          run_all_smokes: ${{ needs.changes.outputs.run_all_smokes }}

  cpp-build-test-windows:
    name: C++ Build & Unit Tests (Windows)
    needs: changes
    if: needs.changes.outputs.run_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check CI storage policy
        run: bash ci/scripts/check_no_actions_artifacts.sh

      - name: Cache Steam Audio SDK
        uses: actions/cache@v5
        with:
          path: src/lib/steamaudio
          key: steamaudio-${{ hashFiles('scripts/install_steam_audio.py') }}

      - name: Install Steam Audio SDK
        env:
          PYTHON: python
        run: bash .github/scripts/install_steam_audio_ci.sh

      - name: Cache SCons build
        uses: actions/cache@v5
        with:
          path: .scons-cache
          key: scons-tests-Windows-v3-${{ hashFiles('src/lib/godot-cpp/SConstruct', 'SConstruct', 'src/register_types.cpp', 'src/resonance_server*.cpp', 'src/resonance_server.h', 'src/handle_manager.cpp', 'src/test/test_main.cpp') }}
          restore-keys: |
            scons-tests-Windows-

      - name: Install SCons
        run: pip install scons

      - name: Create bin directory
        run: mkdir -p addons/nexus_resonance/bin/windows

      - name: Build C++ extension and tests
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: scons platform=windows target=editor build_tests=1 -j${NUMBER_OF_PROCESSORS:-4}

      - name: Run C++ unit tests
        run: ./build/tests/nexus_resonance_tests.exe
